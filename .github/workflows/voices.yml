name: Voices

# Builds voice-check on a Mac, makes each chosen local voice speak a few sentences, and has Whisper
# write down what it heard. The WAVs, timings and transcripts are uploaded as `voices-<model>`.
# Run it from the Actions tab or with: gh workflow run voices.yml --ref <branch> -f models=pocket,ming

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Comma-separated: pocket, audio8, ming, qwen3, raon"
        default: "pocket,ming,qwen3"
      extra:
        description: "Extra voice-check arguments, e.g. --voice marius"
        default: ""

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.list.outputs.models }}
    steps:
      - id: list
        run: echo "models=$(echo '${{ inputs.models }}' | jq -R -c 'split(",") | map(gsub(" "; ""))')" >> "$GITHUB_OUTPUT"

  speak:
    needs: plan
    name: ${{ matrix.model }}
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.plan.outputs.models) }}
    defaults:
      run:
        working-directory: Packages/LocalVoices
    steps:
      - uses: actions/checkout@v4

      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build voice-check
        run: |
          set -o pipefail
          xcodebuild build -scheme voice-check -configuration Release -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" MACOSX_DEPLOYMENT_TARGET=14.0 CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/build.log"
          ls "$RUNNER_TEMP/dd/Build/Products/Release"

      - name: Show compile errors
        if: failure()
        run: |
          grep -E -A8 "error:" "$RUNNER_TEMP/build.log" | head -150 || true
          tail -30 "$RUNNER_TEMP/build.log"

      - name: Speak
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/out"
          ref=()
          if [[ -f Tests/reference.wav ]]; then
            ref=(--ref Tests/reference.wav --ref-text "$(cat Tests/reference.txt)")
          fi
          case "${{ matrix.model }}" in audio8|raon) ;; *) ref=() ;; esac
          "$RUNNER_TEMP/dd/Build/Products/Release/voice-check" "${{ matrix.model }}" \
            --models "$RUNNER_TEMP/models" --out "$RUNNER_TEMP/out" "${ref[@]}" ${{ inputs.extra }} 2>&1 | tee "$RUNNER_TEMP/out/${{ matrix.model }}-log.txt"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the words with Whisper
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q faster-whisper
          "$RUNNER_TEMP/venv/bin/python" Scripts/check_speech.py "$RUNNER_TEMP/out"
          cat "$RUNNER_TEMP/out/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: voices-${{ matrix.model }}
          path: ${{ runner.temp }}/out/
          retention-days: 14
