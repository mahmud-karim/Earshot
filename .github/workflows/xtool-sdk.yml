name: xtool SDK

# Builds xtool's Darwin Swift SDK from the runner's Xcode for a Linux x86_64 host, encrypted with
# a key only the owner holds (secret XTOOL_SDK_KEY). Lives on its own branch; it is not part of the app.

on:
  push:
    branches: [tools/xtool-sdk]

permissions:
  contents: read

jobs:
  sdk:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Build the SDK
        env:
          KEY: ${{ secrets.XTOOL_SDK_KEY }}
        run: |
          set -euo pipefail
          test -n "$KEY"
          # The released xtool.app hangs on start here (it carries a provisioning profile), so build the CLI.
          git clone -q --depth 1 --branch 1.24.0 https://github.com/xtool-org/xtool xtool-src
          (cd xtool-src && swift build -c release --product xtool 2>&1 | tail -5)
          XT="$PWD/xtool-src/.build/release/xtool"
          limit() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          limit 60 "$XT" --version < /dev/null
          limit 1800 script -q /dev/null "$XT" sdk build /Applications/Xcode_26.6.app "$RUNNER_TEMP/sdk" --arch x86_64 < /dev/null
          ls -la "$RUNNER_TEMP/sdk"
          tar -C "$RUNNER_TEMP/sdk" -cf - . | zstd -T0 -10 | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KEY -out "$RUNNER_TEMP/darwin-sdk.tar.zst.enc"
          ls -la "$RUNNER_TEMP/darwin-sdk.tar.zst.enc"

      - uses: actions/upload-artifact@v4
        with:
          name: xtool-sdk-encrypted
          path: ${{ runner.temp }}/darwin-sdk.tar.zst.enc
          retention-days: 3
          compression-level: 0
