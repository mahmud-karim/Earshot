# XcodeGen specification. The Xcode project is generated from this file (`xcodegen generate`) and is
# not committed. CI does this on a macOS runner; nothing here needs a Mac on the desk.
name: Earshot

options:
  minimumXcodeGenVersion: "2.42.0"
  bundleIdPrefix: com.mahmudkarim
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # Unsigned: LiveContainer signs the app itself when it is installed.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

packages:
  LocalVoices:
    path: Packages/LocalVoices

targets:
  Earshot:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: LocalVoices
        product: LocalVoices
    info:
      path: Generated/Earshot-Info.plist
      properties:
        CFBundleDisplayName: Earshot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        CFBundleURLTypes:
          - CFBundleURLName: com.mahmudkarim.Earshot
            CFBundleURLSchemes:
              - earshot
        NSMicrophoneUsageDescription: "Earshot listens while you talk to it and turns your speech into text."
        NSSpeechRecognitionUsageDescription: "Earshot turns your speech into text on this iPhone."
        NSPhotoLibraryUsageDescription: "Earshot attaches a photo you pick to your question."
        NSLocalNetworkUsageDescription: "Earshot can use speech and language models running on your PC."
        NSAppTransportSecurity:
          # Models on your own PC are reached over plain HTTP inside your tailnet or home network.
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mahmudkarim.Earshot
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
